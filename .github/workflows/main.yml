name: Install Java Versions

on: push

jobs:
  install:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ["17", "21"]

    steps:
      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-${{ matrix.version }}-jre

      - name: Check Java version
        run: java -version
