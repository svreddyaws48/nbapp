name: Python Matrix Demo

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: ["3.10", "3.12"]

    steps:
      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python${{ matrix.version }}
          python --version

      - name: Check Python version
        run: python --version
